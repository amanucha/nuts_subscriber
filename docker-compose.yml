version: '3.8'

services:
  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_DB: nutsdb
      POSTGRES_USER: nutsuser
      POSTGRES_PASSWORD: nutspassword
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./setup_db.sql:/docker-entrypoint-initdb.d/setup_db.sql

  app:
    build: .
    depends_on:
      - db
    environment:
      - DB_HOST=db
    command: python main.py

volumes:
  db_data:

